version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_URL=http://localhost:8900
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8900:8900"
    volumes:
      - ./backend:/app
      - conicet-data:/mnt/shared/conicet-data
    env_file:
      - ./backend/.env

volumes:
  conicet-data:
